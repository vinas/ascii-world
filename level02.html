<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
        <meta charset="UTF-8">
        <title>Ascii World Adventure</title>
        <meta content='width=device-width, user-scalable=no, initial-scale=1.0' name='viewport' />

        <link href="css/styles.css" rel="stylesheet" />
    </head>
    <body>
        <div id="gameElements">
            <div id="gameBrackground"></div>
            <div id="timer">
                <label>Fase: </label>
                <label id="level"></label><br/>
                <label>Tempo: </label>
                <label id="time"></label><br/>
                <label>Estágio: </label>
                <label id="stage"></label><br/>
            </div>
            <div id="ufo" class="hidable enemy"><img src="img/enemies/ufo01.gif" id="ufoImg" /></div>
            <div id="abduction" class="hidable"><img src="img/enemies/abduction01.gif" id="abductionImg" /></div>
            <div id="pig" class="hidable enemy"><img src="img/enemies/runningPig01.gif" id="pigImg" /></div>
            <div id="alien" class="hidable enemy"><img src="img/enemies/walkingAlien01.gif" id="alienImg" /></div>
            <div id="bigBoss" class="hidable"><img src="img/enemies/bigBoss01.gif" id="bigBossImg" /></div>
            <div id="dialogBalloon" class="hidable"></div>
            <div id="charman" class="charman"><img src="img/charman/charman-01.png" id="charmanImg" /></div>
            <div class="ufoShot hidable" id="ufoShot"></div>
            <div class="charShot hidable" id="charShot"></div>
            <div id="boom" class="hidable"><img src="" id="boomImg" /></div>

            <div class="controller">
                <div id="btnAttack" class="btn forceRight fire"></div>
                <div id="btnJump" class="btn forceRight jump"></div>
                <div id="btnLeft" class="btn forceLeft moveLeft"></div>
                <div id="btnRight" class="btn forceLeft moveRight"></div>
            </div>
        </div>
        <div id="startGame"><img src="img/game-start.gif" class="startGameImg" /></div>
        <div id="gameOver">
            <label>Estágio alcançado: </label>
            <label id="lastStage"></label><br/>
            <label>Tempo Total: </label>
            <label id="gameTime"></label>
        </div>
        <div id="levelScore">
            <label>Estágio alcançado: </label>
            <label id="levelScoreStage"></label><br/>
            <label>Tempo Total: </label>
            <label id="levelScoreTime"></label>
            <img src="img/game-start.gif" class="startGameImg" />
        </div>
    </body>
    <!-- game js files begin -->
    <script src="js/globals.js"></script>
    <script src="js/dom.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/time-utils.js"></script>
    <script src="js/sounds.js"></script>
    <script src="js/map-physics.js"></script>
    <script src="js/level-map.js"></script>
    <script src="js/charman.js"></script>
    <script src="js/projectiles.js"></script>
    <script src="js/enemies.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/screens.js"></script>
    <script src="js/input.js"></script>
    <script src="js/events.js"></script>
    <script src="js/setup.js"></script>
    <script src="js/game.js"></script>
    <script src="js/levels/level02.js"></script>
    <script src="js/levels/dialogs02.js"></script>
    <script src="js/start-app.js"></script>
    <!-- game js files end -->
</html>
